{% extends 'base.html' %} {% block content %}
<h2>👤 Profile Check</h2>

<div class="card p-4 mt-3">
  <form method="post" action="/analyze/">
    {% csrf_token %}

    <input
      type="text"
      name="username"
      class="form-control mb-2"
      placeholder="Enter username"
    />
    <input
      type="email"
      name="email"
      class="form-control mb-2"
      placeholder="Enter email"
    />
    <input
      type="text"
      name="url"
      class="form-control mb-2"
      placeholder="Enter social media profile link (Instagram, LinkedIn, Facebook, X, YouTube, TikTok, etc.)"
    />

    <textarea
      name="text"
      class="form-control mb-2"
      placeholder="Optional message or bio"
    ></textarea>

    <button class="btn btn-primary">Check Profile Risk</button>
  </form>
</div>
{% endblock %}
